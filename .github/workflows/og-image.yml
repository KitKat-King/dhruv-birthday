name: Render share card

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install rasterizer + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-roboto fonts-dejavu-core
          npm install --no-save sharp

      - name: Render cover.png
        run: node scripts/make-og.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/cover.png
          git diff --staged --quiet || git commit -m "Render share card PNG"
          git push
